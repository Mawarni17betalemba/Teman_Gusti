<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#004D40"><title>TEMAN GUSTY</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><section id="login" class="card login"><div class="logo">TG</div><h1>TEMAN GUSTY</h1><p>Komunitas online</p><input id="name" placeholder="Nama / panggilan"><input id="wa" placeholder="Nomor WhatsApp"><input id="email" type="email" placeholder="Email login"><input id="pass" type="password" placeholder="Password min. 6 karakter"><button id="loginBtn">Masuk / Daftar</button><small id="status"></small></section><section id="main" class="hidden"><header><b>TEMAN GUSTY</b><span id="who"></span><button id="logout">Keluar</button></header><nav><button data-t="chat">💬 Chat</button><button data-t="gallery">🖼️ Galeri</button><button data-t="dues">💰 Iuran</button><button data-t="trips">🏝️ Wisata</button><button data-t="profile">👤 Profil</button></nav><main><section id="chat" class="tab"><div id="messages" class="messages"></div><div class="compose"><input id="text" placeholder="Tulis pesan..."><input id="chatFile" type="file" accept="image/*,video/*" hidden><button id="pick">📎</button><button id="send">Kirim</button></div></section><section id="gallery" class="tab hidden"><h2>Galeri</h2><input id="caption" placeholder="Keterangan"><input id="galleryFile" type="file" accept="image/*,video/*"><button id="gallerySend">Upload</button><div id="grid" class="grid"></div></section><section id="dues" class="tab hidden"><h2>Donasi & Iuran</h2><select id="kind"><option>iuran</option><option>donasi</option></select><input id="amount" type="number" placeholder="Jumlah (Rp)"><input id="note" placeholder="Catatan"><button id="pay">Catat</button><div id="payments"></div></section><section id="trips" class="tab hidden"><h2>Rencana Wisata</h2><input id="tripTitle" placeholder="Nama kegiatan"><input id="tripLoc" placeholder="Lokasi"><input id="tripDate" type="date"><input id="tripCost" type="number" placeholder="Perkiraan biaya"><textarea id="tripDesc" placeholder="Keterangan"></textarea><button id="tripAdd">Tambah</button><div id="tripList"></div></section><section id="profile" class="tab hidden"><h2>Profil</h2><input id="pname"><input id="pwa"><button id="saveProfile">Simpan</button><p id="role"></p></section></main></section><script type="module" src="app.js"></script></body></html>
